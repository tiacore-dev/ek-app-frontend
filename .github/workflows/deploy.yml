name: Deploy to Server

on:
  push:
    branches: [master, dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Production
        if: github.ref_name == 'master'
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            cd apps/ek-app-frontend &&
            git fetch origin master &&
            git reset --hard origin/master &&
            docker compose down &&
            docker compose up --build -d
          "

      - name: Deploy to Development
        if: github.ref_name == 'dev'
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            cd apps/ek-app-frontend-dev &&
            git fetch origin dev &&
            git reset --hard origin/dev &&
            docker compose down &&
            docker compose up --build -d
          "

  notify:
    name: 📬 Notifications
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: 📬 Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          SERVICE_NAME: ek-app-frontend
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          # via env, not inline ${{ }}: commit text must not be parsed as shell
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_LOGIN: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram creds missing, skip"
            exit 0
          fi

          REF_NAME="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA:0:8}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          RUN_URL="${REPO_URL}/actions/runs/${GITHUB_RUN_ID}"

          case "${REF_NAME}" in
            master) ENV_NAME="prod" ;;
            *)      ENV_NAME="${REF_NAME}" ;;
          esac

          # HTML escape для Telegram
          html_escape() {
            printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          SAFE_MSG="$(html_escape "${COMMIT_MESSAGE:-}")"
          SAFE_AUTHOR="$(html_escape "${AUTHOR_NAME:-$AUTHOR_LOGIN}")"

          if [ "${DEPLOY_STATUS}" = "success" ]; then
            HEAD="✅ <b>Frontend deploy успешен</b>"
            EXTRA_LINK=""
          else
            HEAD="🛑 <b>Ошибка фронтового деплоя</b> (deploy=${DEPLOY_STATUS})"
            EXTRA_LINK="<a href=\"${RUN_URL}\">🔍 Открыть GitHub Actions</a>"
          fi

          TEXT="$(cat <<EOF
          ${HEAD}

          🧩 <b>Сервис:</b> <code>${SERVICE_NAME}</code>
          🧩 <b>Env:</b> <code>${ENV_NAME}</code>
          📦 <b>Ветка:</b> <code>${REF_NAME}</code>
          🔖 <b>Коммит:</b> <code>${SHORT_SHA}</code>
          👤 <b>Автор:</b> <a href="https://github.com/${AUTHOR_LOGIN}">${SAFE_AUTHOR}</a>

          📝 <b>Сообщение:</b>
          <code>${SAFE_MSG}</code>

          <a href="${RUN_URL}">🔗 Открыть GitHub Actions</a>
          <a href="${REPO_URL}">📦 Репозиторий</a>
          ${EXTRA_LINK}
          EOF
          )"

          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            ${TELEGRAM_THREAD_ID:+-d message_thread_id="${TELEGRAM_THREAD_ID}"} \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true \
            --data-urlencode "text=${TEXT}" >/dev/null || echo "Telegram send failed"
